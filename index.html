<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para mi Polvorón 💌</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Georgia, 'Times New Roman', serif; }
    body {
      overflow-x: hidden;
      color: #5b2d45;
      background: linear-gradient(-45deg, #ffd7dc, #e5d8ff, #ffffff, #d8ecff, #f7c6d0);
      background-size: 400% 400%;
      animation: fondo 14s ease infinite;
    }
    @keyframes fondo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .scene {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px 50px;
      position: relative;
      isolation: isolate;
    }
    .glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.65), transparent 48%);
      pointer-events: none;
      z-index: -2;
    }
    .floating-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
    .float {
      position: absolute;
      bottom: -70px;
      opacity: .72;
      animation: subir linear infinite;
      filter: drop-shadow(0 4px 8px rgba(97, 35, 70, .18));
    }
    @keyframes subir {
      0% { transform: translateY(0) rotate(0deg) scale(.8); opacity: 0; }
      12% { opacity: .75; }
      100% { transform: translateY(-120vh) rotate(360deg) scale(1.15); opacity: 0; }
    }
    .intro, .letter-wrap {
      width: min(92vw, 680px);
      text-align: center;
      transition: opacity .8s ease, transform .8s ease;
    }
    .intro.hidden { opacity: 0; transform: scale(.92); pointer-events: none; position: absolute; }
    .title {
      font-size: clamp(2rem, 7vw, 3.5rem);
      margin: 0 0 10px;
      font-style: italic;
      text-shadow: 0 3px 12px rgba(255,255,255,.85);
    }
    .subtitle { font-size: 1.08rem; margin-bottom: 28px; }
    .envelope {
      width: min(82vw, 360px);
      height: 235px;
      margin: 0 auto 24px;
      position: relative;
      perspective: 900px;
      filter: drop-shadow(0 18px 24px rgba(80, 37, 62, .28));
    }
    .env-back {
      position: absolute; inset: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, #fff8f5, #f5d9e7);
      border: 2px solid rgba(173, 89, 127, .25);
      overflow: hidden;
    }
    .env-back::before, .env-back::after {
      content: '';
      position: absolute; bottom: -10px;
      width: 72%; height: 72%;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(173,89,127,.18);
      transform: rotate(35deg);
    }
    .env-back::before { left: -37%; }
    .env-back::after { right: -37%; transform: rotate(-35deg); }
    .flap {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 58%;
      transform-origin: top;
      background: linear-gradient(145deg, #ffeef2, #e9cce0);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      z-index: 4;
      transition: transform 1.15s ease;
      backface-visibility: hidden;
    }
    .seal {
      position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
      width: 68px; height: 68px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #c63d65, #92274a);
      color: white; font-size: 30px; z-index: 5;
      box-shadow: 0 8px 14px rgba(113,27,60,.28), inset 0 2px 4px rgba(255,255,255,.3);
      transition: opacity .5s ease, transform .5s ease;
    }
    .envelope.open .flap { transform: rotateX(180deg); z-index: 1; }
    .envelope.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
    .btn {
      border: 0;
      padding: 15px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #b82f59, #7c3aa5);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(103, 40, 93, .25);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn:active { transform: scale(.97); }
    .letter-wrap { display: none; opacity: 0; transform: translateY(25px); }
    .letter-wrap.show { display: block; animation: aparecer 1s ease forwards; }
    @keyframes aparecer { to { opacity: 1; transform: translateY(0); } }
    .letter {
      position: relative;
      background: rgba(255, 253, 248, .92);
      border: 1px solid rgba(138, 73, 103, .18);
      border-radius: 26px;
      box-shadow: 0 22px 45px rgba(80, 40, 71, .22);
      padding: clamp(26px, 6vw, 52px);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .letter::before {
      content: '🌹';
      position: absolute; top: 14px; left: 18px; font-size: 34px; transform: rotate(-18deg);
    }
    .letter::after {
      content: '🌹';
      position: absolute; bottom: 14px; right: 18px; font-size: 34px; transform: rotate(162deg);
    }
    .letter h1 { margin: 0 0 24px; font-size: clamp(1.8rem, 6vw, 2.65rem); font-style: italic; color: #8c2e55; }
    #message {
      min-height: 430px;
      font-size: clamp(1rem, 3.6vw, 1.18rem);
      line-height: 1.85;
      text-align: left;
      white-space: pre-wrap;
      font-style: italic;
    }
    .cursor { display: inline-block; width: 2px; height: 1em; background: #8c2e55; margin-left: 3px; animation: parpadeo .8s infinite; vertical-align: -2px; }
    @keyframes parpadeo { 50% { opacity: 0; } }
    .final { display:none; margin-top: 26px; font-size: 1.15rem; font-weight: 700; color: #9a315b; }
    .final.show { display:block; animation: aparecer .9s ease forwards; }

    .question-box {
      display: none;
      margin-top: 34px;
      padding: 24px 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,230,238,.9), rgba(232,222,255,.9));
      border: 1px solid rgba(140,46,85,.18);
      box-shadow: 0 12px 25px rgba(80,40,71,.12);
      text-align: center;
    }
    .question-box.show { display: block; animation: aparecer .9s ease forwards; }
    .question-box h2 { margin: 0 0 18px; font-size: clamp(1.35rem, 5vw, 1.8rem); color: #8c2e55; }
    .answers { display: grid; gap: 12px; }
    .answer-btn {
      border: 0;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,.88);
      color: #71314f;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 14px rgba(80,40,71,.12);
      transition: transform .18s ease, background .18s ease;
    }
    .answer-btn:hover { transform: translateY(-2px); background: #fff; }
    .answer-btn:disabled { opacity: .65; cursor: wait; }
    .response-status { min-height: 28px; margin: 16px 0 0; font-weight: 700; color: #8c2e55; }
    .music-control {
      position: fixed; right: 14px; bottom: 14px; z-index: 10;
      border: 0; border-radius: 999px; padding: 11px 15px;
      background: rgba(255,255,255,.85); color: #793250;
      box-shadow: 0 8px 18px rgba(65,35,57,.18);
      backdrop-filter: blur(6px); cursor: pointer; display: none;
    }
    .music-control.show { display:block; }
    @media (max-width: 480px) {
      #message { min-height: 520px; line-height: 1.72; }
      .letter { border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="floating-layer" id="floatingLayer"></div>

  <main class="scene">
    <section class="intro" id="intro">
      <h1 class="title">Tengo algo para ti 💌</h1>
      <p class="subtitle">Una pequeña carta hecha con mucho cariño para mi Polvorón 🌹❤️</p>
      <div class="envelope" id="envelope" aria-hidden="true">
        <div class="env-back"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>
      <button class="btn" id="openBtn">Presiona aquí ❤️</button>
    </section>

    <section class="letter-wrap" id="letterWrap">
      <article class="letter">
        <h1>Para mi Polvorón 🌹❤️</h1>
        <div id="message"></div><span class="cursor" id="cursor"></span>
        <div class="final" id="finalText">Gracias por endulzar mis días, mi Polvorón ❤️✨</div>
        <section class="question-box" id="questionBox">
          <h2>¿Te gustó la carta? 💌</h2>
          <div class="answers">
            <button class="answer-btn" data-answer="Me sorprendió">Me sorprendió</button>
            <button class="answer-btn" data-answer="Me gustó mucho">Me gustó mucho</button>
            <button class="answer-btn" data-answer="Me encantó">Me encantó</button>
            <button class="answer-btn" data-answer="Te ganaste un beso 😘">Te ganaste un beso 😘</button>
          </div>
          <p class="response-status" id="responseStatus" aria-live="polite"></p>
        </section>
      </article>
    </section>
  </main>

  <button class="music-control" id="musicBtn">🔊 Música</button>
  <audio id="music" loop preload="auto">
    <source src="ssstik.io_1790003008434.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const text = `Quizás llevamos poco tiempo de conocernos, pero ha sido suficiente para darme cuenta de la persona tan bonita que eres. No solamente por fuera, sino también por esa manera tan especial que tienes de ser. ❤️\n\nAdmiro mucho lo trabajadora y luchadora que eres. Me encanta ver cómo, cuando te propones algo, buscas la manera de conseguirlo y no te rindes hasta lograrlo. Esa determinación tuya es una de las tantas cosas bonitas que he podido descubrir en ti. 🌹\n\nY aunque ha sido poco el tiempo que llevo conociéndote, sin darme cuenta te has vuelto alguien muy importante para mí. De esas personas que llegan inesperadamente y poco a poco comienzan a ocupar un lugar especial. 💕\n\nPuede parecer algo sencillo, pero recibir un mensaje tuyo es suficiente para sacarme una sonrisa. A veces solo basta ver tu nombre aparecer en mi teléfono para alegrarme un poquito más y hacer que mi día se sienta diferente.\n\nTienes esa bonita capacidad de endulzarme el día sin siquiera intentarlo. Y quizás por eso te digo mi Polvorón, porque entre tantas cosas cotidianas, llegaste tú a ponerle un poquito más de dulzura a mis días. ❤️\n\nMe gusta compartir mi tiempo contigo, hablar contigo, conocerte un poquito más cada día y descubrir todas esas pequeñas cosas que te hacen ser tú.\n\nNo sé qué nos depare el tiempo, pero sí sé que me alegra muchísimo haberte conocido y que, en este corto tiempo, hayas logrado convertirte en alguien tan especial para mí.\n\nSigue siendo esa mujer bonita, trabajadora, luchadora y decidida que he tenido la suerte de conocer. 🌹\n\nY nunca olvides que, en algún lugar, hay alguien a quien una simple notificación con tu nombre ya es capaz de hacer sonreír. ❤️✨`;

    const intro = document.getElementById('intro');
    const envelope = document.getElementById('envelope');
    const openBtn = document.getElementById('openBtn');
    const letterWrap = document.getElementById('letterWrap');
    const message = document.getElementById('message');
    const cursor = document.getElementById('cursor');
    const finalText = document.getElementById('finalText');
    const music = document.getElementById('music');
    const musicBtn = document.getElementById('musicBtn');
    const questionBox = document.getElementById('questionBox');
    const responseStatus = document.getElementById('responseStatus');
    const answerButtons = document.querySelectorAll('.answer-btn');

    function createFloaters(extra = 0) {
      const layer = document.getElementById('floatingLayer');
      const icons = ['❤️','💕','🌹','💖','🌸'];
      const amount = 24 + extra;
      for (let i = 0; i < amount; i++) {
        const el = document.createElement('span');
        el.className = 'float';
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (16 + Math.random() * 23) + 'px';
        el.style.animationDuration = (9 + Math.random() * 10) + 's';
        el.style.animationDelay = (-Math.random() * 18) + 's';
        layer.appendChild(el);
      }
    }

    async function typeWords() {
      const words = text.split(/(\s+)/);
      for (const word of words) {
        message.textContent += word;
        const delay = word.trim() ? 145 : 25;
        await new Promise(r => setTimeout(r, delay));
      }
      cursor.style.display = 'none';
      finalText.classList.add('show');
      questionBox.classList.add('show');
      createFloaters(18);
    }

    openBtn.addEventListener('click', async () => {
      openBtn.disabled = true;
      envelope.classList.add('open');
      music.volume = 0.45;
      try { await music.play(); } catch (e) {}
      musicBtn.classList.add('show');
      setTimeout(() => {
        intro.classList.add('hidden');
        letterWrap.classList.add('show');
        setTimeout(typeWords, 650);
      }, 1150);
    });

    musicBtn.addEventListener('click', async () => {
      if (music.paused) {
        try { await music.play(); } catch (e) {}
        musicBtn.textContent = '🔊 Música';
      } else {
        music.pause();
        musicBtn.textContent = '🔇 Silenciada';
      }
    });


    answerButtons.forEach(button => {
      button.addEventListener('click', async () => {
        const answer = button.dataset.answer;
        answerButtons.forEach(btn => btn.disabled = true);
        responseStatus.textContent = 'Enviando tu respuesta... 💌';

        const formData = new FormData();
        formData.append('respuesta', answer);
        formData.append('_subject', 'Respuesta a la carta para mi Polvorón 💌');
        formData.append('_cc', 'Jonathanmoiseslopezromero@gmail.com');
        formData.append('_template', 'table');
        formData.append('_captcha', 'false');
        formData.append('pagina', window.location.href);

        try {
          const response = await fetch('https://formsubmit.co/ajax/mezajosue832@gmail.com', jonathanmoiseslopezromero@gmail.com', {
            method: 'POST',
            headers: { 'Accept': 'application/json' },
            body: formData
          });
          if (!response.ok) throw new Error('No se pudo enviar');
          responseStatus.textContent = '¡Respuesta enviada! ❤️';
          button.style.background = '#fff';
          button.style.transform = 'scale(1.03)';
          createFloaters(14);
        } catch (error) {
          responseStatus.textContent = 'No se pudo enviar. Revisa la conexión e inténtalo nuevamente.';
          answerButtons.forEach(btn => btn.disabled = false);
        }
      });
    });

    createFloaters();
  </script>
</body>
</html>
